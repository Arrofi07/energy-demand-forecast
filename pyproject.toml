[project]
name = "energy-demand-forecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.5.5",
    "holidays>=0.101",
    "ipykernel>=7.3.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "mlflow==2.17.2",
    "nbformat>=5.10.4",
    "optuna>=4.9.0",
    "pandas==2.2.3",
    "pandera[pandas]>=0.32.1",
    "plotly>=6.9.0",
    "pmdarima>=2.1.1",
    "prophet>=1.3.0",
    "protobuf==4.25.3",
    "pyarrow==17.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "setuptools>=83.0.0",
    "shap>=0.52.0",
    "statsforecast>=2.1.1",
    "statsmodels>=0.14.6",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that fit real models (Prophet/SARIMA/LightGBM) and are slower to run",
]
